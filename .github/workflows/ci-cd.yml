name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSIONS: "3.10,3.11,3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # 1. Backend tests (matrix across Python versions)
  # ------------------------------------------------------------------
  test-backend:
    name: Test Backend (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('backend/requirements-core.txt') }}-${{ hashFiles('backend/requirements-ml.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install system dependencies (PyAV/FFmpeg headers)
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libsndfile1 ffmpeg

      - name: Install core Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Install optional ML dependencies (non-fatal)
        working-directory: ./backend
        run: |
          pip install -r requirements-ml.txt || echo "ML deps unavailable — heuristic fallback will be used"

      - name: Run tests
        working-directory: ./backend
        env:
          MURF_API_KEY: test_key
          ENVIRONMENT: test
          SARVAM_API_KEY: test_key
        run: |
          python --version
          pip list
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend-${{ matrix.python-version }}

  # ------------------------------------------------------------------
  # 2. Frontend tests + build
  # ------------------------------------------------------------------
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build (production)
        working-directory: ./frontend
        run: npm run build

  # ------------------------------------------------------------------
  # 3. Lint + code quality
  # ------------------------------------------------------------------
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install black==23.12.0 flake8==6.1.0 mypy==1.7.1

      - name: Run Black (check)
        working-directory: ./backend
        run: black --check .

      - name: Run Flake8
        working-directory: ./backend
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run MyPy
        working-directory: ./backend
        run: mypy . --ignore-missing-imports || true

  # ------------------------------------------------------------------
  # 4. MLOps — model + dependency validation + security
  # ------------------------------------------------------------------
  mlops:
    name: MLOps Validation
    runs-on: ubuntu-latest
    needs: [test-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (PyAV/FFmpeg headers)
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libsndfile1 ffmpeg

      - name: Install core Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Install optional ML dependencies (non-fatal)
        working-directory: ./backend
        run: |
          pip install -r requirements-ml.txt || echo "ML deps unavailable — heuristic fallback will be used"

      - name: Verify YAMNet class map present
        working-directory: ./backend
        run: |
          if [ ! -f models/yamnet_class_map.csv ]; then
            echo "::warning::models/yamnet_class_map.csv missing — YAMNet will download it at first cold start"
          else
            echo "✅ YAMNet class map present"
          fi

      - name: Dependency vulnerability scan (safety)
        working-directory: ./backend
        run: |
          pip install safety==2.3.5
          safety check --file requirements.txt || true

      - name: Static security scan (bandit)
        working-directory: ./backend
        run: |
          pip install bandit==1.7.5
          bandit -r . -ll || true

  # ------------------------------------------------------------------
  # 5. Docker image builds (multi-arch, gated on tests + lint + mlops)
  # ------------------------------------------------------------------
  docker-build:
    name: Build Docker Images (Multi-Arch)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, lint, mlops]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # 6. Deploy Backend to Render (main branch only)
  # ------------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # ------------------------------------------------------------------
  # 7. Deploy Frontend to Vercel (main branch only)
  # ------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel production
        run: |
          cd frontend
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
